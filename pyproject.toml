[project]
name = "Babl"
version = "0.1.0"
description = "A Basic Application to find new Books that you may Like."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deep-translator>=1.11.4",
    "duckdb>=1.5.6",
    "lingua-language-detector>=2.0.0",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "streamlit>=1.65.0",
    "streamlit-autocomplete>=0.1.0",
    "torchvision>=0.29.1",
]

# An application (scripts run directly), not an installable package.
[tool.uv]
package = false